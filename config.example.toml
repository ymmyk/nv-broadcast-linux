# nv-broadcast-linux example config.
# Copy to ~/.config/nv-broadcast/config.toml and edit.

input_device  = ""                  # empty = default source; see `nvbcast list`
output_name   = "NV-Broadcast-Mic"  # virtual mic name apps will select
sample_rate   = 48000
frame_ms      = 10
channels      = 1

[denoise]
backend         = "rnnoise"  # "rnnoise" now; "cuda" = Phase-2 GPU backend stub
suppression_db  = 24.0       # broadband suppression depth
vad_threshold   = 0.5        # voice activity gate 0..1 (higher = stricter)
keyboard_boost  = 0.6        # 0..1 extra attenuation on key-click transients

[cuda]
device_id = 0
model     = "deepfilternet"  # experimental stub backend

# NVIDIA Maxine (Broadcast-quality) GPU backend. Needs the Audio Effects SDK:
# NVIDIA Developer account -> download Audio Effects SDK for Linux (accept the
# Maxine EULA) -> extract to ~/.local/share/nv-broadcast/maxine so that
# lib/libnv_audio_effects.so and models/denoiser_48k.trtpkg exist.
[maxine]
lib        = ""              # empty = libnv_audio_effects.so via loader path
model      = ""              # empty/"denoiser_48k" = $NVB_MAXINE_DIR/models/denoiser_48k.trtpkg
effect     = "denoiser"
enable_vad = true
